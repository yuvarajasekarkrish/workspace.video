services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace_video
    ports:
      - "5432:5432"
    volumes:
      - workspace_video_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - workspace_video_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # 7880: HTTP API + WebSocket signalling (what LIVEKIT_URL points at).
      - "7880:7880"
      # 7881: TCP ICE/TURN fallback, for networks that block UDP.
      - "7881:7881"
      # The actual RTP media path — WITHOUT this range, signalling succeeds
      # and the room reports "connected" while carrying no audio at all, the
      # single easiest mistake to make wiring up a LiveKit dev server.
      - "51000-51100:51000-51100/udp"

volumes:
  workspace_video_postgres_data:
  workspace_video_redis_data:

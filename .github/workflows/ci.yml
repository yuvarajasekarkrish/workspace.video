name: CI

# Every push to master and every pull request. Nothing here retries a test or
# loosens a timeout: a red run is inspected from its report (see the test step
# and the uploaded vitest-report.json files), then fixed on evidence.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace_video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://workspace:workspace@localhost:5432/workspace_video

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be current)
        run: pnpm install --frozen-lockfile

      - name: Generate the database client and apply migrations
        run: |
          pnpm --filter @workspace-video/db run generate
          pnpm --filter @workspace-video/db exec prisma migrate deploy

      - name: The retired internal name must not come back
        run: bash scripts/check-no-old-name.sh

      - name: Deploy and script tests (config generator, report checker)
        run: node --test deploy/livekit/render-config.test.mjs deploy/deploy.test.mjs scripts/check-test-report.test.mjs scripts/check-backup-fresh.test.mjs

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Tests (every one gates; a JSON report with durations is written per package)
        run: pnpm -r run test --reporter=verbose --reporter=json --outputFile=vitest-report.json

      - name: Test totals and slowest tests (fails if any package ran zero tests)
        if: always()
        run: node scripts/check-test-report.mjs

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: |
            apps/*/vitest-report.json
            packages/*/vitest-report.json
          if-no-files-found: warn

  images:
    # Builds both deploy images (not pushed) and checks the built artifacts:
    # no build-time placeholder leaked into the image environment, and a container
    # started with no settings refuses to start (the production guards, in the real image).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          push: false
          tags: workspace-video-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build the realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/realtime.Dockerfile
          load: true
          push: false
          tags: workspace-video-realtime:ci
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,scope=realtime,mode=max

      - name: No build-time placeholder secret is left in either image
        run: |
          for image in workspace-video-web:ci workspace-video-realtime:ci; do
            if docker run --rm --entrypoint env "$image" | grep -E 'AUTH_SECRET|build-only'; then
              echo "::error::$image contains a build-time placeholder in its environment"
              exit 1
            fi
          done

      - name: Images run as an unprivileged user and hold no history, env files or dev media config
        run: |
          for image in workspace-video-web:ci workspace-video-realtime:ci; do
            user=$(docker run --rm --entrypoint id "$image" -un)
            [ "$user" = "node" ] || { echo "::error::$image runs as '$user', not node"; exit 1; }
            if docker run --rm --entrypoint sh "$image" -c 'ls -a /repo; ls /repo/.env* /repo/livekit.yaml 2>/dev/null' | grep -E '^\.git$|\.env$|livekit\.yaml'; then
              echo "::error::$image contains a file that must stay out of images"
              exit 1
            fi
          done

      - name: A container with no settings refuses to start in production
        run: |
          for image in workspace-video-web:ci workspace-video-realtime:ci; do
            output=$(timeout 90 docker run --rm "$image" 2>&1) && status=0 || status=$?
            if [ "$status" = 0 ] || [ "$status" = 124 ]; then
              echo "::error::$image did not refuse to start with no settings (exit $status; 124 means it kept running)"
              echo "$output" | tail -20
              exit 1
            fi
            echo "$output" | grep -q "Refusing to start in production" || {
              echo "::error::$image failed, but not with the production guard message:"
              echo "$output" | tail -20
              exit 1
            }
            echo "$image refused to start, as it should"
          done

  proxy-allowlist:
    # Proves with real containers that the proxy forwards only /socket.io and /health
    # to the realtime server (see deploy/Caddyfile).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/proxy/verify-allowlist.sh
